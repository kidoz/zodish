name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example v0.10.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify-version:
    name: Verify version metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Check manifest and release tag versions
        env:
          REF_NAME: ${{ env.RELEASE_TAG }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          cargo = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          project_version = pyproject["project"]["version"]
          cargo_version = cargo["package"]["version"]
          if project_version != cargo_version:
              raise SystemExit(
                  f"version mismatch: pyproject.toml {project_version}, "
                  f"Cargo.toml {cargo_version}"
              )
          tag_version = os.environ["REF_NAME"].removeprefix("v")
          if tag_version != project_version:
              raise SystemExit(
                  f"release tag {os.environ['REF_NAME']} does not match "
                  f"package version {project_version}"
              )
          print(f"version ok: {project_version}")
          PY

  build-sdist:
    name: Build sdist
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - run: python -m pip install 'maturin>=1.15,<2'
      - run: maturin sdist --out dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Build wheels (${{ matrix.os }} / ${{ matrix.target }} / ${{ matrix.manylinux }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux (glibc)
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
            interpreter: python3.14
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto
            interpreter: python3.14
          # musllinux (Alpine / musl libc)
          - os: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
            interpreter: python3.14
          - os: ubuntu-latest
            target: aarch64
            manylinux: musllinux_1_2
            interpreter: python3.14
          # macOS
          - os: macos-latest
            target: x86_64
            manylinux: auto
            interpreter: python3.14
          - os: macos-latest
            target: aarch64
            manylinux: auto
            interpreter: python3.14
          # Windows
          - os: windows-latest
            target: x64
            manylinux: auto
            interpreter: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          # abi3-py314: one stable-ABI wheel per platform covers Python 3.14+.
          args: --release --locked --interpreter ${{ matrix.interpreter }} --out dist
          manylinux: ${{ matrix.manylinux }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist/*.whl

  build-free-threaded-wheels:
    name: Build free-threaded wheels (${{ matrix.os }} / ${{ matrix.target }} / ${{ matrix.python }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            python: '3.14t'
          - os: ubuntu-latest
            target: x86_64
            python: '3.15t'
          - os: ubuntu-24.04-arm
            target: aarch64
            python: '3.14t'
          - os: ubuntu-24.04-arm
            target: aarch64
            python: '3.15t'
          - os: macos-latest
            target: aarch64
            python: '3.14t'
          - os: macos-latest
            target: aarch64
            python: '3.15t'
          - os: macos-15-intel
            target: x86_64
            python: '3.14t'
          - os: macos-15-intel
            target: x86_64
            python: '3.15t'
          - os: windows-latest
            target: x64
            python: '3.14t'
          - os: windows-latest
            target: x64
            python: '3.15t'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: python -m pip install 'maturin>=1.15,<2'
      - name: Build free-threaded wheel
        run: >-
          maturin build --release --locked --interpreter python
          --compatibility pypi --out dist
      - name: Smoke-test the free-threaded wheel
        run: |
          python -m pip install --no-index --no-deps --force-reinstall dist/*.whl
          python examples/verify_native.py
          python -m unittest discover -s tests -v
          python examples/quickstart.py
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-free-threaded-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.python }}
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    needs: [build-sdist, build-wheels, build-free-threaded-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Verify distribution artifacts
        run: python scripts/verify_dist.py dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

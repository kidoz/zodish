name: tests
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --group dev --group benchmark
      - run: ruff check .
      - run: mypy
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python examples/quickstart.py
      - run: python benchmarks/bench_parse.py --smoke
      - run: python benchmarks/bench_async.py --smoke
      - run: python -m pip install --group benchmark
      - run: python benchmarks/bench_compare.py --check-only
      - name: Exercise benchmark worker argument forwarding
        run: >-
          python benchmarks/bench_compare.py --library pydantic
          --scenario object_success --processes 1 --values 1
          --warmups 1 --min-time 0.001
  free-threaded:
    name: free-threaded (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14t', '3.15t']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install .
      - run: python examples/verify_native.py
      - run: python -m unittest discover -s tests -v
      - run: python examples/quickstart.py
      - run: python benchmarks/bench_parse.py --smoke
      - run: python benchmarks/bench_async.py --smoke
  free-threaded-package:
    name: free-threaded package (${{ matrix.os }} / ${{ matrix.target }} / ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            python: '3.14t'
          - os: ubuntu-latest
            target: x86_64
            python: '3.15t'
          - os: ubuntu-24.04-arm
            target: aarch64
            python: '3.14t'
          - os: ubuntu-24.04-arm
            target: aarch64
            python: '3.15t'
          - os: macos-latest
            target: aarch64
            python: '3.14t'
          - os: macos-latest
            target: aarch64
            python: '3.15t'
          - os: macos-15-intel
            target: x86_64
            python: '3.14t'
          - os: macos-15-intel
            target: x86_64
            python: '3.15t'
          - os: windows-latest
            target: x64
            python: '3.14t'
          - os: windows-latest
            target: x64
            python: '3.15t'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install 'maturin>=1.15,<2'
      - name: Build free-threaded wheel
        run: >-
          maturin build --release --locked --interpreter python
          --compatibility pypi --out dist
      - name: Smoke-test the free-threaded wheel
        run: |
          python -m pip install --no-index --no-deps --force-reinstall dist/*.whl
          python examples/verify_native.py
          python -m unittest discover -s tests -v
          python examples/quickstart.py
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install 'maturin>=1.15,<2'
      - run: maturin build --release --locked --interpreter python --out dist
      - run: maturin sdist --out dist
      - run: python scripts/verify_dist.py dist
      - name: Smoke-test the wheel
        run: |
          python -m pip install --no-index --no-deps --force-reinstall dist/*.whl
          python examples/verify_native.py
          python -m unittest discover -s tests -v
          python examples/quickstart.py
      - name: Smoke-test the sdist
        run: |
          python -m pip uninstall -y zodish
          python -m pip install --no-index --no-deps --no-cache-dir --no-build-isolation --force-reinstall dist/*.tar.gz
          python examples/verify_native.py
          python -m unittest discover -s tests -v
          python examples/quickstart.py
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.15'
      - name: Smoke-test the abi3 wheel on Python 3.15
        if: runner.os == 'Linux'
        run: |
          python -m pip install --no-index --no-deps --force-reinstall dist/*.whl
          python examples/verify_native.py
          python -m unittest discover -s tests -v
          python examples/quickstart.py

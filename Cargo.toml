[package]
name = "zodish-core"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Rust validation engine for the Zodish Python package"
authors = ["Aleksandr Pavlov <ckidoz@gmail.com>"]
repository = "https://github.com/kidoz/zodish"

[lib]
name = "_native"
crate-type = ["cdylib"]
path = "rust/lib.rs"

[dependencies]
pyo3 = { version = "=0.30.1", features = ["abi3-py314"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
